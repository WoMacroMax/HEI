<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sketch SVG – Both Versions</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; padding: 32px; }
    h2 { margin-bottom: 8px; color: #333; }
    .label { font-size: 13px; color: #888; margin-bottom: 12px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 24px; margin-bottom: 40px; }
    svg { display: block; }
  </style>
</head>
<body>

<!-- ─────────────────────────────────────────────
     VERSION 1 · FAITHFUL (sketchy / hand-drawn)
───────────────────────────────────────────── -->
<div class="card">
  <h2>Version 1 — Faithful (sketchy)</h2>
  <p class="label">Mimics the loose, wobbly quality of the original pen strokes.</p>

  <svg viewBox="0 0 900 420" width="900" height="420" xmlns="http://www.w3.org/2000/svg">

    <!-- head circle – slightly wobbly ellipse -->
    <ellipse cx="148" cy="168" rx="90" ry="88"
             fill="none" stroke="#aaa" stroke-width="6"
             stroke-linecap="round"/>

    <!-- left hair/ear blob -->
    <path d="M 62 122 C 45 105, 28 108, 22 125 C 15 143, 28 165, 50 168 C 60 169, 68 162, 62 122 Z"
          fill="#222"/>

    <!-- right hair/ear blob -->
    <path d="M 208 108 C 218 95, 232 98, 238 112 C 244 128, 235 148, 218 150 C 208 152, 200 144, 208 108 Z"
          fill="#222"/>

    <!-- left eye (dash) -->
    <line x1="105" y1="155" x2="122" y2="152"
          stroke="#555" stroke-width="4" stroke-linecap="round"/>

    <!-- right eye (dash) -->
    <line x1="150" y1="150" x2="167" y2="148"
          stroke="#555" stroke-width="4" stroke-linecap="round"/>

    <!-- nose -->
    <path d="M 138 172 C 140 180, 148 182, 148 176"
          fill="none" stroke="#555" stroke-width="3" stroke-linecap="round"/>

    <!-- mouth / smirk -->
    <path d="M 120 198 C 130 206, 155 205, 162 198"
          fill="none" stroke="#555" stroke-width="3.5" stroke-linecap="round"/>

    <!-- neck / connector line to lizard -->
    <path d="M 236 160 C 255 158, 270 160, 285 162"
          fill="none" stroke="#aaa" stroke-width="5" stroke-linecap="round"/>

    <!-- lizard body – rough elongated shape -->
    <path d="M 285 148
             C 320 138, 390 132, 445 140
             C 490 147, 530 148, 560 142
             C 580 138, 598 130, 614 118
             C 625 110, 630 108, 640 100
             C 620 112, 608 108, 600 120
             C 585 140, 572 158, 560 168
             C 530 185, 490 192, 445 192
             C 390 192, 320 188, 285 178 Z"
          fill="none" stroke="#aaa" stroke-width="5"
          stroke-linejoin="round" stroke-linecap="round"/>

    <!-- lizard legs – 4 wobbly sticks with feet -->
    <!-- leg 1 -->
    <path d="M 340 185 C 338 200, 336 215, 332 228 M 332 228 C 325 235, 316 238, 310 235"
          fill="none" stroke="#aaa" stroke-width="4.5" stroke-linecap="round"/>
    <!-- leg 2 -->
    <path d="M 395 190 C 393 206, 390 220, 386 232 M 386 232 C 380 240, 370 242, 364 238"
          fill="none" stroke="#aaa" stroke-width="4.5" stroke-linecap="round"/>
    <!-- leg 3 -->
    <path d="M 460 192 C 458 208, 456 222, 452 235 M 452 235 C 446 243, 436 246, 430 241"
          fill="none" stroke="#aaa" stroke-width="4.5" stroke-linecap="round"/>
    <!-- leg 4 -->
    <path d="M 520 188 C 518 204, 516 218, 512 230 M 512 230 C 506 238, 496 240, 490 236"
          fill="none" stroke="#aaa" stroke-width="4.5" stroke-linecap="round"/>

    <!-- lizard crest / open mouth on right -->
    <path d="M 590 140 C 600 125, 615 112, 635 100 C 645 94, 655 90, 660 95
             C 650 100, 638 108, 628 118 C 618 130, 608 142, 600 155"
          fill="none" stroke="#aaa" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- signature (approximated) -->
    <text x="490" y="360"
          font-family="'Brush Script MT', 'Comic Sans MS', cursive"
          font-size="52" fill="#111" transform="rotate(-4, 490, 360)">Yt Buch</text>

  </svg>
</div>


<!-- ─────────────────────────────────────────────
     VERSION 2 · CLEAN (smooth / polished)
───────────────────────────────────────────── -->
<div class="card">
  <h2>Version 2 — Cleaned Up (smooth)</h2>
  <p class="label">Same composition with smooth bezier curves and consistent stroke weights.</p>

  <svg viewBox="0 0 900 420" width="900" height="420" xmlns="http://www.w3.org/2000/svg">

    <!-- head circle -->
    <circle cx="148" cy="168" r="88"
            fill="none" stroke="#999" stroke-width="5"/>

    <!-- left ear/hair blob -->
    <ellipse cx="52" cy="138" rx="32" ry="24" fill="#222" transform="rotate(-20,52,138)"/>

    <!-- right ear/hair blob -->
    <ellipse cx="222" cy="126" rx="20" ry="22" fill="#222" transform="rotate(15,222,126)"/>

    <!-- left eye -->
    <line x1="106" y1="154" x2="122" y2="152" stroke="#444" stroke-width="4" stroke-linecap="round"/>

    <!-- right eye -->
    <line x1="152" y1="150" x2="168" y2="148" stroke="#444" stroke-width="4" stroke-linecap="round"/>

    <!-- nose -->
    <path d="M 138 172 Q 145 182 150 175"
          fill="none" stroke="#444" stroke-width="3" stroke-linecap="round"/>

    <!-- mouth -->
    <path d="M 120 198 Q 140 210 162 198"
          fill="none" stroke="#444" stroke-width="3.5" stroke-linecap="round"/>

    <!-- neck connector -->
    <line x1="236" y1="160" x2="286" y2="160"
          stroke="#999" stroke-width="5" stroke-linecap="round"/>

    <!-- lizard body (closed smooth shape) -->
    <path d="M 286 148
             C 340 135, 410 132, 460 140
             C 500 147, 535 148, 562 140
             C 578 135, 595 126, 614 110
             Q 596 120, 582 138
             C 568 158, 546 175, 510 182
             C 470 190, 420 192, 370 190
             C 334 188, 300 184, 286 175 Z"
          fill="none" stroke="#999" stroke-width="5"
          stroke-linejoin="round" stroke-linecap="round"/>

    <!-- legs -->
    <g stroke="#999" stroke-width="4.5" stroke-linecap="round" fill="none">
      <!-- leg 1 -->
      <line x1="340" y1="183" x2="332" y2="228"/>
      <line x1="332" y1="228" x2="312" y2="236"/>
      <!-- leg 2 -->
      <line x1="395" y1="188" x2="387" y2="232"/>
      <line x1="387" y1="232" x2="367" y2="240"/>
      <!-- leg 3 -->
      <line x1="458" y1="190" x2="450" y2="234"/>
      <line x1="450" y1="234" x2="430" y2="242"/>
      <!-- leg 4 -->
      <line x1="515" y1="186" x2="508" y2="228"/>
      <line x1="508" y1="228" x2="490" y2="236"/>
    </g>

    <!-- lizard crest / open-jaw detail -->
    <path d="M 592 138 C 606 122, 622 110, 642 98"
          fill="none" stroke="#999" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 642 98 C 632 108, 620 124, 610 142"
          fill="none" stroke="#999" stroke-width="4.5" stroke-linecap="round"/>

    <!-- signature -->
    <text x="490" y="360"
          font-family="'Brush Script MT', 'Comic Sans MS', cursive"
          font-size="52" fill="#111" transform="rotate(-4, 490, 360)">Yt Buch</text>

  </svg>
</div>

</body>
</html>

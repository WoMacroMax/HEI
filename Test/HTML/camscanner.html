<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DocScan — CamScanner Clone</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh;display:flex;flex-direction:column}

/* Header */
header{background:#1565c0;color:#fff;padding:0 20px;height:56px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.2);flex-shrink:0}
header .logo{font-size:20px;font-weight:700;letter-spacing:-0.5px}
header .logo span{color:#90caf9}
header .subtitle{font-size:12px;color:#90caf9;font-weight:500}

/* Main */
.app{display:flex;flex:1;overflow:hidden;height:calc(100vh - 56px)}

/* Left Panel */
.left{width:300px;background:#fff;border-right:1px solid #e0e0e0;display:flex;flex-direction:column;flex-shrink:0}
.panel-title{font-size:11px;font-weight:700;color:#888;letter-spacing:.8px;padding:14px 16px 8px;border-bottom:1px solid #f0f0f0}

.upload-zone{margin:16px;border:2px dashed #b0bec5;border-radius:12px;padding:32px 16px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;background:#fafbfd}
.upload-zone:hover,.upload-zone.drag{border-color:#1565c0;background:#e3f2fd}
.upload-zone .icon{font-size:36px;margin-bottom:8px}
.upload-zone p{font-size:13px;color:#666;line-height:1.5}
.upload-zone strong{color:#1565c0}
#fileInput{display:none}

.cam-btn{margin:0 16px 16px;background:#1565c0;color:#fff;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:600;cursor:pointer;width:calc(100% - 32px);display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
.cam-btn:hover{background:#0d47a1}

/* Thumbnail list */
.doc-list{flex:1;overflow-y:auto;padding:8px}
.doc-thumb{border-radius:8px;overflow:hidden;margin-bottom:8px;border:2px solid transparent;cursor:pointer;transition:border-color .15s;position:relative;background:#f5f5f5}
.doc-thumb.active{border-color:#1565c0}
.doc-thumb img{width:100%;display:block;max-height:120px;object-fit:cover}
.doc-thumb .thumb-label{font-size:11px;color:#555;padding:4px 8px;background:#fff}
.doc-thumb .thumb-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.doc-thumb:hover .thumb-del{opacity:1}

/* Center */
.center{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#e8eaf0}
.center-toolbar{background:#fff;border-bottom:1px solid #e0e0e0;padding:8px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.center-toolbar .tool-group{display:flex;gap:4px;align-items:center;border-right:1px solid #e0e0e0;padding-right:12px;margin-right:4px}
.center-toolbar .tool-group:last-child{border:none}
.tb-btn{background:#f5f5f5;border:1px solid #e0e0e0;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;font-weight:500;color:#444;transition:background .15s,border-color .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.tb-btn:hover{background:#e3f2fd;border-color:#90caf9;color:#1565c0}
.tb-btn.active{background:#1565c0;color:#fff;border-color:#1565c0}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}

.canvas-area{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px}
.canvas-wrap{position:relative;display:inline-block;box-shadow:0 4px 20px rgba(0,0,0,.2)}
#mainCanvas{display:block;max-width:100%;cursor:crosshair}
#cropCanvas{position:absolute;top:0;left:0;pointer-events:none}

/* Right Panel */
.right{width:220px;background:#fff;border-left:1px solid #e0e0e0;display:flex;flex-direction:column;flex-shrink:0}
.controls{padding:12px}
.ctrl-group{margin-bottom:16px}
.ctrl-label{font-size:11px;font-weight:700;color:#888;letter-spacing:.5px;margin-bottom:8px;display:block}
.ctrl-row{display:flex;flex-direction:column;gap:6px}
.filter-btn{border:1px solid #e0e0e0;border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;font-weight:500;background:#fafafa;color:#444;transition:all .15s;text-align:left}
.filter-btn:hover{background:#e3f2fd;border-color:#90caf9;color:#1565c0}
.filter-btn.active{background:#1565c0;color:#fff;border-color:#1565c0}

.slider-group{display:flex;flex-direction:column;gap:10px}
.slider-item label{font-size:11px;color:#666;display:flex;justify-content:space-between;margin-bottom:3px}
.slider-item input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:#ddd;outline:none;cursor:pointer}
.slider-item input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#1565c0;cursor:pointer}

.export-section{margin-top:auto;padding:12px;border-top:1px solid #f0f0f0}
.export-btn{width:100%;padding:10px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.export-pdf{background:#e53935;color:#fff}
.export-pdf:hover{background:#c62828}
.export-img{background:#43a047;color:#fff}
.export-img:hover{background:#2e7d32}

/* Camera modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}
.modal-box{background:#000;border-radius:16px;overflow:hidden;width:640px;max-width:95vw}
.modal-header{background:#1a1a1a;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.modal-header span{color:#fff;font-weight:600;font-size:14px}
.modal-close{background:none;border:none;color:#aaa;font-size:20px;cursor:pointer}
#cameraFeed{width:100%;display:block;max-height:400px;object-fit:cover}
.modal-footer{background:#1a1a1a;padding:12px 16px;display:flex;justify-content:center;gap:12px}
.snap-btn{background:#fff;border:none;border-radius:50%;width:60px;height:60px;font-size:24px;cursor:pointer;transition:transform .15s}
.snap-btn:hover{transform:scale(1.08)}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:#bbb;text-align:center;padding:40px}
.empty-state .icon{font-size:64px}
.empty-state p{font-size:14px;line-height:1.6}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#323232;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:200}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="logo">Doc<span>Scan</span></div>
  <div class="subtitle">CamScanner-style Document Capture</div>
</header>

<div class="app">

  <!-- Left: Upload + Thumbnails -->
  <div class="left">
    <div class="panel-title">DOCUMENTS</div>
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <div class="icon">📄</div>
      <p>Drop images here or<br><strong>click to upload</strong></p>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple />
    <button class="cam-btn" onclick="openCamera()">📷 Use Camera</button>
    <div class="doc-list" id="docList"></div>
  </div>

  <!-- Center: Canvas -->
  <div class="center">
    <div class="center-toolbar" id="centerToolbar">
      <div class="tool-group">
        <button class="tb-btn" id="btnCrop" onclick="toggleCropMode()" title="Drag corners to adjust crop">✂️ Crop</button>
        <button class="tb-btn" onclick="rotateCW()" title="Rotate 90° clockwise">↻ Rotate</button>
        <button class="tb-btn" onclick="flipH()" title="Flip horizontal">↔ Flip</button>
      </div>
      <div class="tool-group">
        <button class="tb-btn" onclick="zoomIn()">🔍+</button>
        <button class="tb-btn" onclick="zoomOut()">🔍-</button>
        <button class="tb-btn" onclick="zoomFit()">⊡ Fit</button>
      </div>
      <div class="tool-group">
        <button class="tb-btn" onclick="undoEdit()">↩ Undo</button>
        <button class="tb-btn" onclick="resetEdits()">⟳ Reset</button>
      </div>
    </div>

    <div class="canvas-area" id="canvasArea">
      <div class="empty-state" id="emptyState">
        <div class="icon">🗂️</div>
        <p>Upload a photo or use the camera<br>to scan a document</p>
      </div>
      <div class="canvas-wrap" id="canvasWrap" style="display:none">
        <canvas id="mainCanvas"></canvas>
        <canvas id="cropCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- Right: Filters & Export -->
  <div class="right">
    <div class="controls">
      <div class="ctrl-group">
        <span class="ctrl-label">FILTER MODE</span>
        <div class="ctrl-row">
          <button class="filter-btn active" data-filter="original" onclick="applyFilter('original')">🎨 Original</button>
          <button class="filter-btn" data-filter="auto" onclick="applyFilter('auto')">✨ Auto Enhance</button>
          <button class="filter-btn" data-filter="bw" onclick="applyFilter('bw')">⬛ Black & White</button>
          <button class="filter-btn" data-filter="gray" onclick="applyFilter('gray')">🩶 Grayscale</button>
          <button class="filter-btn" data-filter="doc" onclick="applyFilter('doc')">📄 Document</button>
          <button class="filter-btn" data-filter="vivid" onclick="applyFilter('vivid')">🌈 Vivid</button>
        </div>
      </div>

      <div class="ctrl-group">
        <span class="ctrl-label">ADJUSTMENTS</span>
        <div class="slider-group">
          <div class="slider-item">
            <label>Brightness <span id="brightnessVal">0</span></label>
            <input type="range" id="brightness" min="-100" max="100" value="0" oninput="updateSlider('brightness',this.value)"/>
          </div>
          <div class="slider-item">
            <label>Contrast <span id="contrastVal">0</span></label>
            <input type="range" id="contrast" min="-100" max="100" value="0" oninput="updateSlider('contrast',this.value)"/>
          </div>
          <div class="slider-item">
            <label>Sharpness <span id="sharpnessVal">0</span></label>
            <input type="range" id="sharpness" min="0" max="10" value="0" oninput="updateSlider('sharpness',this.value)"/>
          </div>
          <div class="slider-item">
            <label>Rotation <span id="rotationVal">0°</span></label>
            <input type="range" id="rotation" min="-180" max="180" value="0" oninput="updateSlider('rotation',this.value)"/>
          </div>
        </div>
      </div>
    </div>

    <div class="export-section">
      <button class="export-btn export-pdf" onclick="exportPDF()">📄 Export PDF</button>
      <button class="export-btn export-img" onclick="exportImage()">🖼 Save as PNG</button>
    </div>
  </div>

</div>

<!-- Camera Modal -->
<div class="modal" id="cameraModal">
  <div class="modal-box">
    <div class="modal-header">
      <span>📷 Camera Capture</span>
      <button class="modal-close" onclick="closeCamera()">✕</button>
    </div>
    <video id="cameraFeed" autoplay playsinline></video>
    <div class="modal-footer">
      <button class="snap-btn" onclick="snapPhoto()" title="Capture">📸</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- jsPDF for PDF export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
// ─── State ───────────────────────────────────────────────────────
let docs = [];           // {id, name, originalData, currentData}
let activeDoc = null;
let activeFilter = 'original';
let zoom = 1;
let rotation = 0;
let editHistory = [];
let cameraStream = null;
let cropMode = false;

// Crop corner state
let corners = []; // [{x,y},{x,y},{x,y},{x,y}] normalized 0..1
let draggingCorner = -1;

const mainCanvas = document.getElementById('mainCanvas');
const cropCanvas = document.getElementById('cropCanvas');
const ctx = mainCanvas.getContext('2d');
const cctx = cropCanvas.getContext('2d');

// ─── Upload ──────────────────────────────────────────────────────
const uploadZone = document.getElementById('uploadZone');
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag');
  [...e.dataTransfer.files].filter(f => f.type.startsWith('image/')).forEach(loadFile);
});

document.getElementById('fileInput').addEventListener('change', e => {
  [...e.target.files].forEach(loadFile);
  e.target.value = '';
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const id = Date.now() + Math.random();
      const doc = { id, name: file.name || 'Scan ' + docs.length, originalData: ev.target.result, currentData: ev.target.result, img };
      docs.push(doc);
      renderThumb(doc);
      selectDoc(doc);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function renderThumb(doc) {
  const list = document.getElementById('docList');
  const div = document.createElement('div');
  div.className = 'doc-thumb';
  div.id = 'thumb-' + doc.id;
  div.innerHTML = `<img src="${doc.currentData}"/><div class="thumb-label">${doc.name}</div><button class="thumb-del" onclick="deleteDoc('${doc.id}',event)">✕</button>`;
  div.onclick = () => selectDoc(doc);
  list.appendChild(div);
}

function deleteDoc(id, e) {
  e.stopPropagation();
  docs = docs.filter(d => d.id != id);
  document.getElementById('thumb-' + id)?.remove();
  if (activeDoc?.id == id) {
    activeDoc = docs[0] || null;
    if (activeDoc) selectDoc(activeDoc);
    else showEmpty();
  }
}

function selectDoc(doc) {
  activeDoc = doc;
  document.querySelectorAll('.doc-thumb').forEach(t => t.classList.remove('active'));
  document.getElementById('thumb-' + doc.id)?.classList.add('active');
  resetEdits(true);
  showCanvas();
  renderDoc();
}

// ─── Canvas Render ───────────────────────────────────────────────
function showCanvas() {
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('canvasWrap').style.display = 'inline-block';
}
function showEmpty() {
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('canvasWrap').style.display = 'none';
}

function renderDoc() {
  if (!activeDoc) return;
  const img = new Image();
  img.onload = () => {
    const maxW = document.getElementById('canvasArea').clientWidth - 48;
    const maxH = document.getElementById('canvasArea').clientHeight - 48;
    let w = img.naturalWidth * zoom;
    let h = img.naturalHeight * zoom;
    if (w > maxW) { const s = maxW / w; w *= s; h *= s; }
    if (h > maxH) { const s = maxH / h; w *= s; h *= s; }

    mainCanvas.width = w;
    mainCanvas.height = h;
    cropCanvas.width = w;
    cropCanvas.height = h;

    ctx.save();
    ctx.translate(w/2, h/2);
    ctx.rotate((rotation * Math.PI) / 180);
    ctx.drawImage(img, -w/2, -h/2, w, h);
    ctx.restore();

    applyFilterToCanvas();
    if (cropMode) drawCropOverlay();
  };
  img.src = activeDoc.currentData;
}

// ─── Filters ─────────────────────────────────────────────────────
function applyFilter(name) {
  activeFilter = name;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === name));
  if (!activeDoc) return;
  applyFilterToCanvas();
  saveThumb();
}

function applyFilterToCanvas() {
  const imageData = ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height);
  const d = imageData.data;
  const brightness = +document.getElementById('brightness').value;
  const contrast = +document.getElementById('contrast').value;

  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i+1], b = d[i+2];

    if (activeFilter === 'bw') {
      const lum = 0.299*r + 0.587*g + 0.114*b;
      const bwVal = lum > 128 ? 255 : 0;
      r = g = b = bwVal;
    } else if (activeFilter === 'gray') {
      const gray = 0.299*r + 0.587*g + 0.114*b;
      r = g = b = gray;
    } else if (activeFilter === 'doc') {
      // Document mode: high contrast B&W with threshold
      const lum = 0.299*r + 0.587*g + 0.114*b;
      const val = lum > 160 ? 255 : Math.max(0, lum - 40);
      r = g = b = val;
    } else if (activeFilter === 'auto') {
      // Auto enhance: boost contrast + slight warmth
      r = clamp(r * 1.1 + 10);
      g = clamp(g * 1.05 + 5);
      b = clamp(b * 0.95);
    } else if (activeFilter === 'vivid') {
      // Vivid: heavy saturation boost
      const avg = (r + g + b) / 3;
      r = clamp(avg + (r - avg) * 1.6);
      g = clamp(avg + (g - avg) * 1.6);
      b = clamp(avg + (b - avg) * 1.6);
    }

    // Brightness
    if (brightness !== 0) {
      const bf = brightness * 1.5;
      r = clamp(r + bf); g = clamp(g + bf); b = clamp(b + bf);
    }

    // Contrast
    if (contrast !== 0) {
      const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
      r = clamp(factor * (r - 128) + 128);
      g = clamp(factor * (g - 128) + 128);
      b = clamp(factor * (b - 128) + 128);
    }

    d[i] = r; d[i+1] = g; d[i+2] = b;
  }
  ctx.putImageData(imageData, 0, 0);
}

function clamp(v) { return Math.max(0, Math.min(255, Math.round(v))); }

// ─── Sliders ─────────────────────────────────────────────────────
function updateSlider(name, val) {
  if (name === 'rotation') {
    rotation = +val;
    document.getElementById('rotationVal').textContent = val + '°';
  } else {
    document.getElementById(name + 'Val').textContent = val;
  }
  renderDoc();
}

// ─── Transforms ──────────────────────────────────────────────────
function rotateCW() {
  rotation = (rotation + 90) % 360;
  document.getElementById('rotation').value = rotation;
  document.getElementById('rotationVal').textContent = rotation + '°';
  renderDoc();
  toast('Rotated 90°');
}

function flipH() {
  if (!activeDoc) return;
  const img = new Image();
  img.onload = () => {
    const tmpC = document.createElement('canvas');
    tmpC.width = img.width; tmpC.height = img.height;
    const tctx = tmpC.getContext('2d');
    tctx.translate(img.width, 0);
    tctx.scale(-1, 1);
    tctx.drawImage(img, 0, 0);
    activeDoc.currentData = tmpC.toDataURL();
    renderDoc();
    saveThumb();
    toast('Flipped');
  };
  img.src = activeDoc.currentData;
}

// ─── Crop Mode ───────────────────────────────────────────────────
function toggleCropMode() {
  cropMode = !cropMode;
  document.getElementById('btnCrop').classList.toggle('active', cropMode);
  if (cropMode) {
    // Default corners = full image
    corners = [{x:0.05,y:0.05},{x:0.95,y:0.05},{x:0.95,y:0.95},{x:0.05,y:0.95}];
    drawCropOverlay();
    cropCanvas.style.pointerEvents = 'all';
    cropCanvas.style.cursor = 'move';
    toast('Drag corners to adjust crop, then click ✂️ Crop again to apply');
  } else {
    // Apply crop
    if (activeDoc) applyCrop();
    cctx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
    cropCanvas.style.pointerEvents = 'none';
  }
}

function drawCropOverlay() {
  cctx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
  const W = cropCanvas.width, H = cropCanvas.height;

  // Dim outside
  cctx.fillStyle = 'rgba(0,0,0,0.45)';
  cctx.fillRect(0, 0, W, H);

  // Clear inside polygon
  cctx.save();
  cctx.globalCompositeOperation = 'destination-out';
  cctx.beginPath();
  cctx.moveTo(corners[0].x*W, corners[0].y*H);
  corners.forEach(c => cctx.lineTo(c.x*W, c.y*H));
  cctx.closePath();
  cctx.fill();
  cctx.restore();

  // Border
  cctx.strokeStyle = '#2196f3';
  cctx.lineWidth = 2;
  cctx.beginPath();
  cctx.moveTo(corners[0].x*W, corners[0].y*H);
  corners.forEach(c => cctx.lineTo(c.x*W, c.y*H));
  cctx.closePath();
  cctx.stroke();

  // Corner handles
  corners.forEach(c => {
    cctx.fillStyle = '#fff';
    cctx.strokeStyle = '#2196f3';
    cctx.lineWidth = 2;
    cctx.beginPath();
    cctx.arc(c.x*W, c.y*H, 8, 0, Math.PI*2);
    cctx.fill();
    cctx.stroke();
  });
}

cropCanvas.addEventListener('mousedown', e => {
  if (!cropMode) return;
  const rect = cropCanvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / cropCanvas.width;
  const my = (e.clientY - rect.top) / cropCanvas.height;
  draggingCorner = corners.findIndex(c => Math.hypot(c.x - mx, c.y - my) < 0.04);
});
cropCanvas.addEventListener('mousemove', e => {
  if (draggingCorner < 0) return;
  const rect = cropCanvas.getBoundingClientRect();
  corners[draggingCorner] = {
    x: Math.max(0, Math.min(1, (e.clientX - rect.left) / cropCanvas.width)),
    y: Math.max(0, Math.min(1, (e.clientY - rect.top) / cropCanvas.height))
  };
  drawCropOverlay();
});
cropCanvas.addEventListener('mouseup', () => { draggingCorner = -1; });

function applyCrop() {
  const W = mainCanvas.width, H = mainCanvas.height;
  // Bounding box of corners
  const xs = corners.map(c => c.x * W);
  const ys = corners.map(c => c.y * H);
  const x0 = Math.min(...xs), y0 = Math.min(...ys);
  const cw = Math.max(...xs) - x0, ch = Math.max(...ys) - y0;
  if (cw < 10 || ch < 10) return;

  saveHistory();
  const tmp = document.createElement('canvas');
  tmp.width = cw; tmp.height = ch;
  tmp.getContext('2d').drawImage(mainCanvas, x0, y0, cw, ch, 0, 0, cw, ch);
  activeDoc.currentData = tmp.toDataURL();
  const img = new Image();
  img.onload = () => { activeDoc.img = img; renderDoc(); saveThumb(); };
  img.src = activeDoc.currentData;
  toast('Crop applied');
}

// ─── Undo / Reset ────────────────────────────────────────────────
function saveHistory() {
  if (!activeDoc) return;
  editHistory.push(activeDoc.currentData);
  if (editHistory.length > 20) editHistory.shift();
}
function undoEdit() {
  if (!editHistory.length) { toast('Nothing to undo'); return; }
  activeDoc.currentData = editHistory.pop();
  const img = new Image();
  img.onload = () => { activeDoc.img = img; renderDoc(); saveThumb(); };
  img.src = activeDoc.currentData;
  toast('Undone');
}
function resetEdits(silent) {
  if (activeDoc) {
    activeDoc.currentData = activeDoc.originalData;
    const img = new Image();
    img.onload = () => { activeDoc.img = img; };
    img.src = activeDoc.originalData;
  }
  activeFilter = 'original';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === 'original'));
  ['brightness','contrast','sharpness'].forEach(s => {
    document.getElementById(s).value = 0;
    document.getElementById(s+'Val').textContent = 0;
  });
  document.getElementById('rotation').value = 0;
  document.getElementById('rotationVal').textContent = '0°';
  rotation = 0;
  zoom = 1;
  editHistory = [];
  if (!silent) { renderDoc(); toast('Reset'); }
}

// ─── Zoom ────────────────────────────────────────────────────────
function zoomIn() { zoom = Math.min(4, zoom + 0.25); renderDoc(); }
function zoomOut() { zoom = Math.max(0.25, zoom - 0.25); renderDoc(); }
function zoomFit() { zoom = 1; renderDoc(); }

// ─── Thumbnail update ────────────────────────────────────────────
function saveThumb() {
  if (!activeDoc) return;
  const el = document.querySelector('#thumb-' + activeDoc.id + ' img');
  if (el) el.src = activeDoc.currentData;
}

// ─── Camera ──────────────────────────────────────────────────────
async function openCamera() {
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    document.getElementById('cameraFeed').srcObject = cameraStream;
    document.getElementById('cameraModal').classList.add('show');
  } catch {
    toast('Camera not available — try uploading an image instead');
  }
}
function closeCamera() {
  cameraStream?.getTracks().forEach(t => t.stop());
  cameraStream = null;
  document.getElementById('cameraModal').classList.remove('show');
}
function snapPhoto() {
  const video = document.getElementById('cameraFeed');
  const tmp = document.createElement('canvas');
  tmp.width = video.videoWidth;
  tmp.height = video.videoHeight;
  tmp.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = tmp.toDataURL('image/png');
  closeCamera();
  const img = new Image();
  img.onload = () => {
    const id = Date.now();
    const doc = { id, name: 'Camera ' + new Date().toLocaleTimeString(), originalData: dataUrl, currentData: dataUrl, img };
    docs.push(doc);
    renderThumb(doc);
    selectDoc(doc);
    toast('Photo captured!');
  };
  img.src = dataUrl;
}

// ─── Export ──────────────────────────────────────────────────────
function exportImage() {
  if (!activeDoc) { toast('No document to export'); return; }
  const link = document.createElement('a');
  link.href = mainCanvas.toDataURL('image/png');
  link.download = (activeDoc.name.replace(/\.[^.]+$/,'') || 'scan') + '_scanned.png';
  link.click();
  toast('Image saved!');
}

function exportPDF() {
  if (!activeDoc) { toast('No document to export'); return; }
  try {
    const { jsPDF } = window.jspdf;
    const dataUrl = mainCanvas.toDataURL('image/jpeg', 0.92);
    const W = mainCanvas.width, H = mainCanvas.height;
    const orientation = W > H ? 'landscape' : 'portrait';
    const pdf = new jsPDF({ orientation, unit: 'px', format: [W, H] });
    pdf.addImage(dataUrl, 'JPEG', 0, 0, W, H);

    if (docs.length > 1 && confirm('Export all ' + docs.length + ' documents as a multi-page PDF?')) {
      docs.forEach((doc, i) => {
        if (i === 0) return; // already added
        const img2 = new Image();
        img2.onload = () => {
          const tmp = document.createElement('canvas');
          tmp.width = img2.width; tmp.height = img2.height;
          tmp.getContext('2d').drawImage(img2, 0, 0);
          pdf.addPage([img2.width, img2.height], img2.width > img2.height ? 'landscape' : 'portrait');
          pdf.addImage(tmp.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, img2.width, img2.height);
          if (i === docs.length - 1) { pdf.save('scan.pdf'); toast('PDF exported!'); }
        };
        img2.src = doc.currentData;
      });
    } else {
      pdf.save((activeDoc.name.replace(/\.[^.]+$/,'') || 'scan') + '.pdf');
      toast('PDF exported!');
    }
  } catch (err) {
    toast('PDF export failed: ' + err.message);
  }
}

// ─── Toast ───────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J&J Tires & Wheels — Business Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:'Outfit',system-ui,sans-serif}
    body{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:32px 20px;
      background:#ffffff;
      animation:fadeIn .8s ease-out both;
      gap:5px;
    }
    .canvas-frame{
      width:min(760px,100%);
      padding:24px;
      border:1px solid rgba(0,0,0,.10);
      border-radius:28px;
      background:#f5f5f5;
      backdrop-filter:blur(8px);
      box-shadow:0 40px 100px rgba(0,0,0,.15);
      animation:fadeIn .9s ease-out both;
    }
    canvas{
      display:block;
      width:100%;
      height:auto;
      border-radius:18px;
      box-shadow:0 24px 60px rgba(0,0,0,.25);
    }

    /* iframe 3D canvas card */
    .iframe-card-wrapper {
      width: min(760px, 100%);
      perspective: 1200px;
      animation: fadeIn 1.1s ease-out both;
    }
    .iframe-canvas-frame {
      width: 100%;
      padding: 24px;
      border: 1px solid rgba(0,0,0,.10);
      border-radius: 28px;
      background: #f5f5f5;
      backdrop-filter: blur(8px);
      box-shadow:
        0 40px 100px rgba(0,0,0,.18),
        0 8px 32px rgba(0,0,0,.12),
        0 2px 8px rgba(0,0,0,.08);
      transform: rotateX(2deg) rotateY(-1deg);
      transform-style: preserve-3d;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      position: relative;
    }
    .iframe-canvas-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 60%);
      pointer-events: none;
      z-index: 1;
    }
    .iframe-canvas-frame:hover {
      transform: rotateX(0deg) rotateY(0deg) translateY(-4px);
      box-shadow:
        0 60px 120px rgba(0,0,0,.22),
        0 12px 40px rgba(0,0,0,.14),
        0 2px 8px rgba(0,0,0,.08);
    }
    .iframe-inner {
      position: relative;
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 24px 60px rgba(0,0,0,.28),
        0 4px 16px rgba(0,0,0,.14);
      background: #0d1a3a;
      transform: translateZ(20px);
    }
    .iframe-inner iframe {
      display: block;
      width: 100%;
      height: 620px;
      border: none;
      border-radius: 18px;
    }
    .iframe-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding: 0 4px;
      position: relative;
      z-index: 2;
    }
    .iframe-label span {
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: rgba(0,0,0,.38);
      letter-spacing: 0.04em;
    }
    .iframe-label a {
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: rgba(0,100,220,.55);
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: color 0.2s;
    }
    .iframe-label a:hover {
      color: rgba(0,100,220,.85);
    }

    /* ── Centre overlay play button ── */
    #audio-overlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      /* Dropped by 10px from -200px to -190px */
      transform: translateY(-190px) scale(0.7);
      transform-origin: center center;
    }
    #audio-toggle-btn {
      pointer-events: all;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      background: rgba(204,34,0,0.93);
      color: #fff;
      font-size: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow:
        0 0 0 10px rgba(204,34,0,0.18),
        0 6px 32px rgba(204,34,0,0.45),
        0 2px 10px rgba(0,0,0,0.28);
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s, opacity 0.4s;
      animation: fadeIn 1s ease-out both, pulse 2.2s ease-in-out infinite;
      backdrop-filter: blur(4px);
    }
    #audio-toggle-btn:hover {
      background: rgba(224,40,0,1);
      transform: scale(1.10);
      box-shadow:
        0 0 0 14px rgba(204,34,0,0.13),
        0 10px 40px rgba(204,34,0,0.55),
        0 2px 10px rgba(0,0,0,0.32);
    }
    #audio-toggle-btn.playing {
      animation: fadeIn 1s ease-out both;
      box-shadow:
        0 0 0 6px rgba(204,34,0,0.12),
        0 5px 22px rgba(204,34,0,0.35),
        0 2px 8px rgba(0,0,0,0.22);
    }
    #audio-btn-label {
      pointer-events: none;
      margin-top: 11px;
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: rgba(26,42,122,0.7);
      text-transform: uppercase;
      text-shadow: 0 1px 6px rgba(255,255,255,0.9);
      transition: opacity 0.3s;
    }

    /* animated bars beneath the button when playing */
    #audio-bars {
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
      margin-top: 8px;
    }
    #audio-bars span {
      display: block;
      width: 3px;
      border-radius: 2px;
      background: #cc2200;
      animation: barBounce 0.9s ease-in-out infinite alternate;
      transform-origin: bottom;
      opacity: 0.85;
    }
    #audio-bars span:nth-child(1){ height: 8px;  animation-delay: 0s; }
    #audio-bars span:nth-child(2){ height: 14px; animation-delay: 0.15s; }
    #audio-bars span:nth-child(3){ height: 6px;  animation-delay: 0.3s; }
    #audio-bars span:nth-child(4){ height: 16px; animation-delay: 0.08s; }
    #audio-bars span:nth-child(5){ height: 10px; animation-delay: 0.22s; }
    #audio-bars.paused span {
      animation-play-state: paused;
      opacity: 0.25;
    }

    @keyframes barBounce {
      from { transform: scaleY(0.3); }
      to   { transform: scaleY(1); }
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 10px rgba(204,34,0,0.18), 0 6px 32px rgba(204,34,0,0.45), 0 2px 10px rgba(0,0,0,0.28); }
      50%      { box-shadow: 0 0 0 18px rgba(204,34,0,0.08), 0 6px 40px rgba(204,34,0,0.55), 0 2px 10px rgba(0,0,0,0.28); }
    }

    @media (orientation: portrait) {
      body {
        align-items: flex-start;
        padding-top: 16px;
        justify-content: flex-start;
      }
      .canvas-frame, .iframe-card-wrapper {
        margin-top: 0;
      }
      .iframe-canvas-frame {
        transform: none;
      }
      .iframe-canvas-frame:hover {
        transform: translateY(-4px);
      }
      .iframe-inner iframe {
        height: 480px;
      }
      #audio-toggle-btn {
        width: 58px;
        height: 58px;
        font-size: 21px;
      }
    }

    @keyframes fadeIn{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }
  </style>
</head>
<body>

  <!-- Hidden HTML5 audio element -->
  <audio
    id="bg-audio"
    src="https://xrwnptogkhxeyamjcxhd.supabase.co/storage/v1/object/public/attachments/1773129841779-BABY_BOY_AFRO.mp3"
    loop
    preload="auto"
    style="display:none"
  ></audio>

  <!-- Centre overlay audio control -->
  <div id="audio-overlay">
    <button id="audio-toggle-btn" aria-label="Toggle audio">▶</button>
    <div id="audio-btn-label">Tap to play</div>
    <div id="audio-bars" class="paused">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <div class="canvas-frame">
    <canvas id="businessCardCanvas" width="1500" height="900" aria-label="J&J Tires & Wheels business card"></canvas>
  </div>

  <!-- 3D shadowed iframe card -->
  <div class="iframe-card-wrapper">
    <div class="iframe-canvas-frame">
      <div class="iframe-inner">
        <iframe
          src="https://process.doc2web.online/api/conversions/238/html"
          title="J&J Tires & Wheels Digital Card"
          loading="lazy"
          allow="autoplay; encrypted-media"
        ></iframe>
      </div>
      <div class="iframe-label">
        <span>DIGITAL BUSINESS CARD</span>
        <a href="https://process.doc2web.online/api/conversions/238/html" target="_blank" rel="noopener noreferrer">rodbiz.digiucard.com ↗</a>
      </div>
    </div>
  </div>

  <script>
    (function(){
      if (window.__d2w_cardInit) return;
      window.__d2w_cardInit = true;

      /* ── Audio player logic ── */
      var audio      = document.getElementById('bg-audio');
      var toggleBtn  = document.getElementById('audio-toggle-btn');
      var audioBars  = document.getElementById('audio-bars');
      var btnLabel   = document.getElementById('audio-btn-label');
      var isPlaying  = false;

      function startAudio() {
        if (!audio) return;
        var playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(function(){});
        }
        isPlaying = true;
        toggleBtn.textContent = '❚❚';
        toggleBtn.classList.add('playing');
        audioBars.classList.remove('paused');
        btnLabel.textContent = 'Now playing';
        btnLabel.style.color = 'rgba(204,34,0,0.75)';
      }

      function stopAudio() {
        if (!audio) return;
        audio.pause();
        isPlaying = false;
        toggleBtn.textContent = '▶';
        toggleBtn.classList.remove('playing');
        audioBars.classList.add('paused');
        btnLabel.textContent = 'Tap to play';
        btnLabel.style.color = 'rgba(26,42,122,0.7)';
      }

      toggleBtn.addEventListener('click', function(){
        if (isPlaying) {
          stopAudio();
        } else {
          startAudio();
        }
      });

      /* Auto-play on page load */
      function autoPlay() {
        startAudio();
      }

      if (document.readyState === 'complete') {
        autoPlay();
      } else {
        window.addEventListener('load', autoPlay);
      }

      /* ── Canvas business card ── */
      function drawRoundedRect(ctx, x, y, w, h, r){
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + w - radius, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
        ctx.lineTo(x + w, y + h - radius);
        ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        ctx.lineTo(x + radius, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
      }

      function drawLogo(ctx, cx, cy, r){
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.35)';
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 6;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = '#3a3a3a';
        ctx.fill();
        ctx.restore();

        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.91, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        ctx.save();
        ctx.font = `900 ${r * 0.72}px Outfit, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#1a2a7a';
        ctx.fillText('J', cx - r * 0.36, cy + r * 0.04);
        ctx.font = `900 ${r * 0.44}px Outfit, sans-serif`;
        ctx.fillStyle = '#cc2200';
        ctx.fillText('&', cx + r * 0.01, cy - r * 0.05);
        ctx.font = `900 ${r * 0.72}px Outfit, sans-serif`;
        ctx.fillStyle = '#1a2a7a';
        ctx.fillText('J', cx + r * 0.38, cy + r * 0.04);
        ctx.restore();
      }

      function drawCard(){
        const canvas = document.getElementById('businessCardCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        ctx.clearRect(0, 0, W, H);

        const bgGrad = ctx.createLinearGradient(0, 0, W, H);
        bgGrad.addColorStop(0,   '#ffe033');
        bgGrad.addColorStop(0.4, '#ffd400');
        bgGrad.addColorStop(0.75,'#f5c200');
        bgGrad.addColorStop(1,   '#e8b800');
        ctx.fillStyle = bgGrad;
        drawRoundedRect(ctx, 0, 0, W, H, 36);
        ctx.fill();

        const sheen = ctx.createLinearGradient(0, 0, W * 0.6, H * 0.55);
        sheen.addColorStop(0, 'rgba(255,255,255,0.42)');
        sheen.addColorStop(0.5,'rgba(255,255,255,0.10)');
        sheen.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = sheen;
        drawRoundedRect(ctx, 0, 0, W, H, 36);
        ctx.fill();

        const logoR = 95;
        const logoCX = W / 2;
        const logoCY = 128;
        drawLogo(ctx, logoCX, logoCY, logoR);

        ctx.save();
        ctx.font = '900 148px Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = '#cc2200';
        ctx.shadowColor = 'rgba(0,0,0,0.18)';
        ctx.shadowBlur = 6;
        ctx.fillText('TIRES', W * 0.33, 368);
        ctx.restore();

        ctx.save();
        ctx.font = '900 120px Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = '#1a2a7a';
        ctx.shadowColor = 'rgba(0,0,0,0.15)';
        ctx.shadowBlur = 5;
        ctx.fillText('&', W * 0.565, 368);
        ctx.restore();

        ctx.save();
        ctx.font = '900 148px Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = '#1a2a7a';
        ctx.shadowColor = 'rgba(0,0,0,0.18)';
        ctx.shadowBlur = 6;
        ctx.fillText('WHEELS', W * 0.77, 368);
        ctx.restore();

        ctx.beginPath();
        ctx.moveTo(60, 400);
        ctx.lineTo(W - 60, 400);
        ctx.strokeStyle = 'rgba(0,0,0,0.18)';
        ctx.lineWidth = 2;
        ctx.stroke();

        const col1X = 130;
        const col2X = W / 2;
        const col3X = W - 130;
        const locY = 460;
        const lineH = 52;

        function addrLine(text, x, y, size, color, align){
          ctx.save();
          ctx.font = `${size || 600} ${size ? size + 'px' : '28px'} Outfit, sans-serif`;
          ctx.textAlign = align || 'center';
          ctx.textBaseline = 'alphabetic';
          ctx.fillStyle = color || '#1a2a7a';
          ctx.fillText(text, x, y);
          ctx.restore();
        }

        addrLine('11 Union St.', col1X, locY, 28, '#1a2a7a', 'center');
        addrLine('Lodi, NJ 07644', col1X, locY + lineH, 28, '#1a2a7a', 'center');
        addrLine('973.777.7952', col1X, locY + lineH * 2, 30, '#cc2200', 'center');

        addrLine('1 Bergen Turnpike,', col2X, locY, 28, '#1a2a7a', 'center');
        addrLine('Little Ferry, NJ 07643', col2X, locY + lineH, 28, '#1a2a7a', 'center');
        addrLine('201.641.7777', col2X, locY + lineH * 2, 30, '#cc2200', 'center');

        addrLine('396 Market St.', col3X, locY, 28, '#1a2a7a', 'center');
        addrLine('Saddle Brook, NJ 07663', col3X, locY + lineH, 28, '#1a2a7a', 'center');
        addrLine('201.587.7771', col3X, locY + lineH * 2, 30, '#cc2200', 'center');

        function vDiv(x, y1, y2){
          ctx.beginPath();
          ctx.moveTo(x, y1);
          ctx.lineTo(x, y2);
          ctx.strokeStyle = 'rgba(0,0,0,0.15)';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        vDiv(W * 0.36, locY - 14, locY + lineH * 2 + 14);
        vDiv(W * 0.64, locY - 14, locY + lineH * 2 + 14);

        ctx.beginPath();
        ctx.moveTo(60, locY + lineH * 2 + 36);
        ctx.lineTo(W - 60, locY + lineH * 2 + 36);
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 2;
        ctx.stroke();

        const websiteY = locY + lineH * 2 + 90;
        ctx.save();
        ctx.font = '700 46px Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.shadowColor = 'rgba(0,0,0,0.12)';
        ctx.shadowBlur = 4;
        ctx.fillStyle = '#1a2a7a';
        ctx.fillText('www.', W / 2 - 260, websiteY);
        ctx.fillStyle = '#cc2200';
        ctx.fillText('jjtiresandwheels', W / 2 + 10, websiteY);
        ctx.fillStyle = '#1a2a7a';
        ctx.fillText('.com', W / 2 + 310, websiteY);
        ctx.restore();

        const socialY = websiteY + 66;
        const socials = [
          { icon: 'f',  handle: 'JJTiresandWheels', color: '#1877F2' },
          { icon: '𝕏',  handle: '@JJ_Tires',        color: '#1a2a7a' },
          { icon: '♪',  handle: '@JJ_Tires',        color: '#1a2a7a' },
          { icon: '⬡',  handle: 'JJ_Tires',         color: '#1a2a7a' },
        ];
        const socW = (W - 120) / socials.length;
        socials.forEach(function(s, i){
          const sx = 60 + socW * i + socW / 2;

          ctx.save();
          ctx.beginPath();
          ctx.arc(sx - socW * 0.22, socialY - 8, 16, 0, Math.PI * 2);
          ctx.fillStyle = s.color;
          ctx.fill();
          ctx.font = '700 16px Outfit, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#ffffff';
          ctx.fillText(s.icon, sx - socW * 0.22, socialY - 8);
          ctx.restore();

          ctx.save();
          ctx.font = '600 24px Outfit, sans-serif';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          const parts = s.handle.split('_');
          if(parts.length > 1){
            ctx.fillStyle = '#1a2a7a';
            ctx.fillText(parts[0] + '_', sx - socW * 0.22 + 22, socialY - 8);
            const prefix = ctx.measureText(parts[0] + '_').width;
            ctx.fillStyle = '#cc2200';
            ctx.fillText(parts[1], sx - socW * 0.22 + 22 + prefix, socialY - 8);
          } else {
            const name = s.handle;
            if(name.includes('and')){
              const split = name.indexOf('and') + 3;
              ctx.fillStyle = '#1a2a7a';
              ctx.fillText(name.slice(0, split), sx - socW * 0.22 + 22, socialY - 8);
              const pw = ctx.measureText(name.slice(0, split)).width;
              ctx.fillStyle = '#cc2200';
              ctx.fillText(name.slice(split), sx - socW * 0.22 + 22 + pw, socialY - 8);
            } else {
              ctx.fillStyle = '#cc2200';
              ctx.fillText(name, sx - socW * 0.22 + 22, socialY - 8);
            }
          }
          ctx.restore();
        });

        ctx.strokeStyle = 'rgba(0,0,0,0.10)';
        ctx.lineWidth = 3;
        drawRoundedRect(ctx, 1.5, 1.5, W - 3, H - 3, 36);
        ctx.stroke();
      }

      function init(){
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(drawCard);
        } else {
          drawCard();
        }
        window.addEventListener('resize', drawCard);
      }

      init();

      /* Subtle 3D tilt on the iframe card based on mouse position */
      const iframeFrame = document.querySelector('.iframe-canvas-frame');
      if (iframeFrame) {
        const wrapper = document.querySelector('.iframe-card-wrapper');
        wrapper.addEventListener('mousemove', function(e){
          const rect = iframeFrame.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dx = (e.clientX - cx) / (rect.width / 2);
          const dy = (e.clientY - cy) / (rect.height / 2);
          const rotX = (-dy * 4).toFixed(2);
          const rotY = (dx * 4).toFixed(2);
          iframeFrame.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
          iframeFrame.style.boxShadow = `
            ${-dx * 10}px ${-dy * 10 + 40}px 100px rgba(0,0,0,.22),
            ${-dx * 4}px ${-dy * 4 + 8}px 32px rgba(0,0,0,.14),
            0 2px 8px rgba(0,0,0,.08)
          `;
        });
        wrapper.addEventListener('mouseleave', function(){
          iframeFrame.style.transform = 'rotateX(2deg) rotateY(-1deg)';
          iframeFrame.style.boxShadow = '';
        });
      }

    })();
  </script>
</body>
</html>

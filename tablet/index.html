<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RodBiz | Under Construction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #050816;
      --accent: #00ffc6;
      --accent-soft: rgba(0, 255, 198, 0.15);
      --text: #f5f5f5;
      --muted: #9ca3af;
      --danger: #f97373;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #111827 0, #020617 40%, #000 100%);
      color: var(--text);
    }

    .uc-wrapper {
      max-width: 640px;
      width: 100%;
      padding: 2.5rem 2rem;
      border-radius: 1.5rem;
      background: linear-gradient(135deg, #020617 0%, #0b1120 40%, #020617 100%);
      box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(148, 163, 184, 0.15);
      position: relative;
      overflow: hidden;
    }

    .uc-wrapper::before {
      content: "";
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 0% 0%, var(--accent-soft) 0, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(56, 189, 248, 0.12) 0, transparent 55%);
      opacity: 0.9;
      pointer-events: none;
    }

    .uc-inner {
      position: relative;
      z-index: 1;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.4);
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    h1 {
      font-size: 2rem;
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    .countdown {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .time-block {
      flex: 1 1 80px;
      min-width: 80px;
      padding: 0.75rem 0.5rem;
      border-radius: 0.75rem;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.35);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .time-block::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(0, 255, 198, 0.12), transparent 60%);
      opacity: 0.7;
      pointer-events: none;
    }

    .time-value {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .time-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .status {
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .status-indicator {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      position: relative;
    }

    .status-indicator::before {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: inherit;
      background: var(--danger);
      box-shadow: 0 0 10px rgba(248, 113, 113, 0.9);
    }

    .footer-note {
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid rgba(31, 41, 55, 0.9);
      padding-top: 1rem;
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .footer-note a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .uc-wrapper {
        padding: 1.75rem 1.25rem;
        border-radius: 1.25rem;
      }

      h1 {
        font-size: 1.6rem;
      }

      .time-value {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <main class="uc-wrapper">
    <div class="uc-inner">
      <div class="badge">
        <span class="badge-dot"></span>
        <span>RodBiz · DigiUCard</span>
      </div>

      <h1>
        Under <span>Construction</span>
      </h1>
      <p class="subtitle">
        We’re building out RodBiz on DigiUCard—optimized, mobile‑ready, and ecosystem‑aware.
        Launching in:
      </p>

      <section class="countdown" aria-label="Countdown to launch">
        <div class="time-block">
          <div id="days" class="time-value">30</div>
          <div class="time-label">Days</div>
        </div>
        <div class="time-block">
          <div id="hours" class="time-value">00</div>
          <div class="time-label">Hours</div>
        </div>
        <div class="time-block">
          <div id="minutes" class="time-value">00</div>
          <div class="time-label">Minutes</div>
        </div>
        <div class="time-block">
          <div id="seconds" class="time-value">00</div>
          <div class="time-label">Seconds</div>
        </div>
      </section>

      <div class="status" id="status-text">
        <span class="status-indicator"></span>
        <span>Countdown is live · auto‑refreshing every second.</span>
      </div>

      <div class="footer-note">
        <span>Target: <span id="target-date"></span></span>
        <span>
          Contact: <a href="tel:7035962482">703‑596‑2482</a>
        </span>
      </div>
    </div>
  </main>

  <script>
    // 30 days from now
    const now = new Date();
    const target = new Date(now.getTime());
    target.setDate(target.getDate() + 30);

    const targetDateEl = document.getElementById("target-date");
    targetDateEl.textContent = target.toLocaleString();

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const statusTextEl = document.getElementById("status-text");

    function pad(num) {
      return num.toString().padStart(2, "0");
    }

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = target.getTime() - now;

      if (distance <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        statusTextEl.innerHTML =
          '<span class="status-indicator"></span><span>Launch window reached · page will update soon.</span>';
        clearInterval(timer);
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
      );
      const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) / (1000 * 60)
      );
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    const timer = setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>

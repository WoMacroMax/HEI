<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Site Under Construction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 2.5rem 2rem;
      max-width: 480px;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 1rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(148, 163, 184, 0.35);
      backdrop-filter: blur(10px);
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      border-radius: 999px;
      border: 2px solid #f97316;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f97316;
      font-size: 2rem;
      position: relative;
    }

    .icon::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: inherit;
      border: 1px dashed rgba(249, 115, 22, 0.4);
      opacity: 0.7;
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 0.75rem;
      letter-spacing: 0.03em;
    }

    p {
      font-size: 0.98rem;
      line-height: 1.6;
      color: #cbd5f5;
      margin-bottom: 1.75rem;
    }

    .countdown {
      display: inline-flex;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }

    .countdown-item {
      min-width: 70px;
      padding: 0.6rem 0.4rem;
      border-radius: 0.75rem;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.4);
    }

    .countdown-number {
      font-size: 1.3rem;
      font-weight: 600;
      color: #f97316;
    }

    .countdown-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #9ca3af;
    }

    .notify {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .notify input {
      padding: 0.6rem 0.75rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      min-width: 220px;
      outline: none;
    }

    .notify input::placeholder {
      color: #6b7280;
    }

    .notify button {
      padding: 0.6rem 1.1rem;
      border-radius: 999px;
      border: none;
      background: #f97316;
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    .notify button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(249, 115, 22, 0.35);
      background: #fb923c;
    }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #6b7280;
    }

    @media (max-width: 480px) {
      .container {
        margin: 1.5rem;
        padding: 2rem 1.5rem;
      }

      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🚧</div>

    <h1>Site Under Construction</h1>
    <p>
      We’re crafting something new for you. This space will be live soon—stay tuned for the launch.
    </p>

    <div class="countdown" id="countdown">
      <div class="countdown-item">
        <div class="countdown-number" id="days">00</div>
        <div class="countdown-label">Days</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-number" id="hours">00</div>
        <div class="countdown-label">Hours</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-number" id="minutes">00</div>
        <div class="countdown-label">Minutes</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-number" id="seconds">00</div>
        <div class="countdown-label">Seconds</div>
      </div>
    </div>

    <div class="notify">
      <input type="email" id="email" placeholder="Enter your email to get notified" />
      <button id="notifyBtn">Notify Me</button>
    </div>

    <div class="footer-note">
      © <span id="year"></span> Your Brand. All rights reserved.
    </div>
  </div>

  <script>
    // Set launch date (YYYY-MM-DD)
    const launchDate = new Date("2026-12-31T00:00:00");

    function updateCountdown() {
      const now = new Date();
      const diff = launchDate - now;

      if (diff <= 0) {
        document.getElementById("countdown").textContent = "We’re live!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("days").textContent = String(days).padStart(2, "0");
      document.getElementById("hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
      document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Simple "Notify Me" handler (front-end only)
    document.getElementById("notifyBtn").addEventListener("click", () => {
      const emailInput = document.getElementById("email");
      const email = emailInput.value.trim();

      if (!email) {
        alert("Please enter an email address.");
        return;
      }

      // Here you’d send `email` to your backend/API.
      alert("Thanks! We’ll let you know when we launch.");
      emailInput.value = "";
    });

    // Set current year
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
